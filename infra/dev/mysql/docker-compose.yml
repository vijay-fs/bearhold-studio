name: dbstudio-mysql-dev

services:
  mysql:
    image: mysql:8.0
    container_name: dbstudio-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: dbstudio_root
      MYSQL_USER: dbstudio
      MYSQL_PASSWORD: dbstudio_dev
      MYSQL_DATABASE: shop
    ports:
      - "3307:3306"
    volumes:
      - dbstudio_mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "dbstudio", "-pdbstudio_dev"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  dbstudio_mysql_data:
